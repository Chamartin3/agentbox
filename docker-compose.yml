# agentbox — reusable compose fragment, project-agnostic.
#
# Include from a project's main docker-compose.yml:
#
#   include:
#     - libs/agentbox/docker-compose.yml
#
# All project-level config is DB-backed (SQLite in the agentbox-data volume):
# agents, workspaces, and settings live in the database, not in files.
#
# Optional env — add the corresponding volumes block to your override file
#   when you need these mounts (see "Optional bind-mounts" in README):
#   AGENTBOX_AGENTS_DIR     host dir → /agentbox/agents.d (ro)
#   AGENTBOX_PROMPTS_DIR    host dir → /agentbox/prompts.d (ro)
#   AGENTBOX_SKILLS_DIR     host dir → /agentbox/skills.d (ro)
#   AGENTBOX_OUTPUTS_DIR    host dir → /agentbox/outputs (rw)
#   AGENTBOX_OPENCODE_AUTH  host path to opencode auth.json (ro)
#                           default: ~/.local/share/opencode/auth.json
#   AGENTBOX_PORT           host port to publish (default 8765)
#   AGENTBOX_CONTAINER_NAME container name override (default "agentbox")
#   AGENTBOX_NETWORK        docker network to join (default "agentbox-network",
#                           must be declared by the parent compose)
#
# Named volumes (persisted across recreations, owned by this stack):
#   agentbox-data           SQLite DB and run artefacts (/data)  [always mounted]
#   agentbox-claude         Claude OAuth credentials (/agentbox/creds/claude)  [always mounted]
#
# Optional named volumes — declare in an override file for persistence:
#   agentbox-workspaces     per-agent workspace trees (/agentbox/workspaces)
#   agentbox-opencode       opencode internal data (/home/appuser/.local/share/opencode)
#   agentbox-npm            npm global cache (internal)
#
# Auth: Claude OAuth credentials live in the agentbox-claude named volume.
# Authenticate once with `claude /login` inside the container — tokens
# persist across recreations.

services:
  agentbox:
    build:
      # Paths in included compose files resolve relative to *this* file.
      context: .
      dockerfile: Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    container_name: ${AGENTBOX_CONTAINER_NAME:-agentbox}
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${AGENTBOX_PORT:-8765}:8765"
    tmpfs:
      - /run/agentbox:size=256m,mode=0700
    volumes:
      # Named volumes — persisted, container-owned
      - agentbox-data:/data
      - agentbox-claude:/agentbox/creds/claude
    env_file:
      # Local secrets (LLM provider API keys etc). Lives next to this
      # compose file so it travels with the agentbox lib. Top-level
      # compose `include:` does NOT auto-load this file for variable
      # interpolation — using env_file injects values straight into the
      # container env instead.
      - path: .env
        required: false
    environment:
      - AGENTBOX_DATA_DIR=/data
      - AGENTBOX_PORT=8765
      - HOME=/home/appuser
      - CLAUDE_CONFIG_DIR=/agentbox/creds/claude
      # LLM provider keys — forwarded from parent compose .env when set.
      - OPENROUTER_API_KEY=${OPEN_ROUTER_API_KEY:-}
      # Ollama hostname rewrite (empty string disables rewriting).
      - AGENTBOX_OLLAMA_URL_REWRITE=${AGENTBOX_OLLAMA_URL_REWRITE:-}
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  # agentbox-mcp — long-running MCP HTTP server (FastMCP, streamable-http).
  # Shares the agentbox image + DB volume so it sees the same agent_versions,
  # prompts, runs, etc. Claude/OpenCode workspaces connect to this via
  # `http://agentbox-mcp:8766/mcp/` over the agentbox network.
  agentbox-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    container_name: ${AGENTBOX_MCP_CONTAINER_NAME:-agentbox-mcp}
    user: "${UID:-1000}:${GID:-1000}"
    command: ["python3", "-m", "agentbox.mcp.server"]
    ports:
      - "${AGENTBOX_MCP_PORT:-8766}:8766"
    volumes:
      - agentbox-data:/data
    environment:
      - AGENTBOX_DATA_DIR=/data
      - AGENTBOX_MCP_TRANSPORT=http
      - AGENTBOX_MCP_HOST=0.0.0.0
      - AGENTBOX_MCP_PORT=8766
      - HOME=/home/appuser
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null -X POST http://localhost:8766/mcp/ -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2024-11-05\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"0\"}}}' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  # Vite dev server with HMR. Always on — browse http://localhost:5174 for
  # instant reloads. The Vite proxy forwards /api to the agentbox service,
  # so 5174 is a complete app URL. Port 8765 still serves the baked dist.
  agentbox-web:
    image: node:20-alpine
    container_name: ${AGENTBOX_WEB_CONTAINER_NAME:-agentbox-web}
    working_dir: /web
    # No `user:` — node_modules ownership in the volume is irrelevant and
    # forcing UID 1000 trips on the empty named volume created as root.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "${AGENTBOX_WEB_PORT:-5174}:5173"
    volumes:
      - ./web:/web
      - agentbox-web-node-modules:/web/node_modules
    environment:
      # Vite dev server proxies /api here. Inside the network, hit the
      # agentbox service by its container name.
      - AGENTBOX_API_URL=http://${AGENTBOX_CONTAINER_NAME:-agentbox}:8765
      # HMR websocket needs to reach the *browser* — that's localhost:5174
      # on the host machine.
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=${AGENTBOX_WEB_PORT:-5174}
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"

  # Plan 16 — opt-in Ollama for the verification harness.
  # Start with:  docker compose --profile verify up -d ollama ollama-seed
  ollama:
    image: ollama/ollama:latest
    profiles: ["verify"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - default
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20
  ollama-seed:
    image: ollama/ollama:latest
    profiles: ["verify"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    networks:
      - default
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull llama3.2:1b && ollama pull qwen2.5-coder:0.5b"

volumes:
  agentbox-data:
  agentbox-claude:
  agentbox-web-node-modules:
  ollama-data:
  # Optional — declare these in an override file for persistence across recreations:
  # agentbox-workspaces:
  # agentbox-opencode:
  # agentbox-npm:

# Default network alias — parent compose can override by setting
# `networks.default.name` to the project's network.
networks:
  default:
    name: ${AGENTBOX_NETWORK:-agentbox-network}
    external: true
