[project]
name = "agentbox"
version = "1.0.0"
description = "Reusable agent orchestration: scoped runners, observability, sessions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-ai>=0.1.0",
  "jinja2>=3.1",
  "typer>=0.12",
  "httpx>=0.27",
  "tomlkit>=0.13",
  "sqlalchemy>=2.0",
  "python-frontmatter>=1.2.0",
  "fastmcp>=0.2",
  "jsonschema>=4.0",
  "alembic>=1.18.4",
  "datamodel-code-generator>=0.26",
]

[project.scripts]
agentbox = "agentbox.cli:app"
agentbox-mcp = "agentbox.mcp.server:main"

[project.entry-points."agentbox.backends"]
claude_code = "agentbox.core.engines.backends.claude_code:ClaudeCodeBackend"
opencode = "agentbox.core.engines.backends.opencode:OpenCodeBackend"
token = "agentbox.core.engines.backends.token:TokenBackend"
codex = "agentbox.core.engines.backends.codex:CodexBackend"
pi = "agentbox.core.engines.backends.pi:PiBackend"


[project.entry-points."agentbox.conversations"]
claude-cli-jsonl = "agentbox.core.execution.history.sources.claude_cli:ClaudeCliJsonlSource"
opencode-session = "agentbox.core.execution.history.sources.opencode:OpencodeSessionSource"
pydantic-ai-history = "agentbox.core.execution.history.sources.pydantic_ai:PydanticAiHistorySource"
agentbox-transcript = "agentbox.core.execution.history.sources.transcript:TranscriptSource"
codex-session = "agentbox.core.execution.history.sources.codex:CodexSessionSource"
pi-session = "agentbox.core.execution.history.sources.pi:PiSessionSource"

[project.entry-points."agentbox.agent_tools"]
# consumers register their tools here; agentbox ships none by default

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "anyio>=4",
  "pyright>=1.1.409",
  "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbox"]
include = ["alembic/**/*"]

[tool.ruff.lint]
extend-select = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
  "unit: fast, isolated tests for a single module",
  "integration: cross-module / executor / API / store tests",
  "e2e: end-to-end tests covering full user flows",
  "slow: tests that take noticeable wall-time",
  "live_ollama: requires a running Ollama instance (set OLLAMA_HOST)",
  "live_callback: requires a consumer Django service reachable at CVMAN_BASE_URL",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  # SQLAlchemy/pydantic-ai occasionally leak sockets and event loops in
  # tests that wrap subprocess + HTTP clients. Pytest's unraisable hook
  # turns those late warnings into PytestUnraisableExceptionWarning,
  # which surfaces as a failure on an unrelated test (ordering-dependent
  # noise). Treat them as warnings only.
  "ignore::pytest.PytestUnraisableExceptionWarning",
  "ignore::ResourceWarning",
]
