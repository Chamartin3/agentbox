[project]
name = "agentbox"
version = "1.0.0"
description = "Reusable agent orchestration: scoped runners, observability, sessions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-ai>=0.1.0",
  "jinja2>=3.1",
  "typer>=0.12",
  "httpx>=0.27",
  "tomlkit>=0.13",
  "sqlalchemy>=2.0",
  "python-frontmatter>=1.2.0",
  "fastmcp>=0.2",
  "jsonschema>=4.0",
  "alembic>=1.18.4",
]

[project.scripts]
agentbox = "agentbox.cli:app"
agentbox-mcp = "agentbox.mcp_server.server:main"

[project.entry-points."agentbox.runners"]
claude_code = "agentbox.core.runners.claude_code:ClaudeCodeRunner"
opencode = "agentbox.core.runners.opencode:OpenCodeRunner"
token = "agentbox.core.runners.token:TokenRunner"

[project.entry-points."agentbox.backends"]
claude_code = "agentbox.core.backends.claude_code:ClaudeCodeBackend"
opencode = "agentbox.core.backends.opencode:OpenCodeBackend"
token = "agentbox.core.backends.token:TokenBackend"
codex = "agentbox.core.backends.codex:CodexBackend"
pi = "agentbox.core.backends.pi:PiBackend"


[project.entry-points."agentbox.conversations"]
claude-cli-jsonl = "agentbox.core.conversations.sources.claude_cli:ClaudeCliJsonlSource"
opencode-session = "agentbox.core.conversations.sources.opencode:OpencodeSessionSource"
pydantic-ai-history = "agentbox.core.conversations.sources.pydantic_ai:PydanticAiHistorySource"
agentbox-transcript = "agentbox.core.conversations.sources.transcript:TranscriptSource"
codex-session = "agentbox.core.conversations.sources.codex:CodexSessionSource"
pi-session = "agentbox.core.conversations.sources.pi:PiSessionSource"

# Register guardrails by adding entries here or in a plugin package:
# [project.entry-points."agentbox.guardrails"]
# my_guardrail = "mypackage.guardrails:MyGuardrail"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "anyio>=4",
  "pyright>=1.1.409",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbox"]
include = ["alembic/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast, isolated tests for a single module",
  "integration: cross-module / executor / API / store tests",
  "slow: tests that take noticeable wall-time",
  "live_ollama: requires a running Ollama instance (set OLLAMA_HOST)",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
]
