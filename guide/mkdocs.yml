site_name: AgentBox
site_description: Run reusable agents in isolated, fully captured environments.
# Needed so the i18n language switcher builds correct /agentbox/ and /agentbox/es/ links.
site_url: https://chamartin3.github.io/agentbox/

extra_css:
  - stylesheets/extra.css
repo_url: https://github.com/Chamartin3/agentbox
repo_name: Chamartin3/agentbox
docs_dir: docs

# Internal notes, not a published page.
exclude_docs: |
  img/README.md

theme:
  name: material
  logo: img/logo.svg
  favicon: img/logo.svg
  language: en
  features:
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.integrate
  palette:
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode

# Language switcher (the flag button in the header) comes from this plugin.
# English pages are foo.md; Spanish pages are foo.es.md alongside them.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Overview: Introducción
            Setup & configuration: Instalación y configuración
            Setup: Instalación
            Configuring a provider: Configurar un proveedor
            Usage: Uso
            Managing Agents: Gestionar agentes
            Structured output: Salida estructurada
            Workspaces: Espacios de trabajo
            Work interactively: Trabajar de forma interactiva
            Automate with webhooks: Automatizar con webhooks
            Evaluate & improve: Evaluar y mejorar
            Swap harnesses & compare: Cambiar de harness y comparar
            Reference: Referencia
            REST & WebSocket API: API REST y WebSocket
            CLI: CLI
            MCP: MCP

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

nav:
  - Overview: index.md
  - Setup & configuration:
      - Setup: 01-setup-system.md
      - Configuring a provider: 02-setup-providers.md
  - Usage:
      - Managing Agents: 03-first-agent.md
      - Structured output: 04-structured-output.md
      - Workspaces: 05-workspaces.md
      - Work interactively: 09-interactive.md
      - Automate with webhooks: 06-webhooks.md
      - Evaluate & improve: 07-evaluate.md
      - Swap harnesses & compare: 08-compare.md
  - Reference:
      - REST & WebSocket API: reference-api.md
      - CLI: reference-cli.md
      - MCP: reference-mcp.md
