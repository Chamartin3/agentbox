{% extends "base.html" %}
{% block title %}agents · agentbox{% endblock %}
{% block content %}
<h1>Agents</h1>
<table id="agents">
  <thead><tr><th>id</th><th>runner</th><th>session</th><th>description</th></tr></thead>
  <tbody></tbody>
</table>
<script>
fetch('/agents').then(r=>r.json()).then(rows => {
  document.querySelector('#agents tbody').innerHTML = rows.map(a => `
    <tr>
      <td>${a.id}</td>
      <td>${a.runner.kind}</td>
      <td>${a.session_mode}</td>
      <td>${a.description||''}</td>
    </tr>`).join('');
});
</script>
{% endblock %}
