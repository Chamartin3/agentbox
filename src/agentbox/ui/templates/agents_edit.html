{% extends "base.html" %}

{% block title %}{{ agent_id }} Edit — agentbox{% endblock %}

{% block content %}
<h1>{{ agent_id }} — Edit</h1>

<p>
  <a href="/agents-ui/{{ agent_id }}">← back to agent</a>
</p>

<form method="post" style="margin-top: 20px;">
  <div style="margin-bottom: 20px;">
    <label for="changelog">Changelog:</label>
    <input type="text" id="changelog" name="changelog" placeholder="Describe your changes" style="width: 100%; padding: 8px;">
  </div>

  <div style="margin-bottom: 20px;">
    <label for="content">Content:</label>
    <textarea id="content" name="content" rows="20" style="width: 100%; padding: 8px; font-family: monospace;">{{ content }}</textarea>
  </div>

  <div>
    <button type="submit" style="padding: 8px 16px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer;">
      Save Changes
    </button>
    <a href="/agents-ui/{{ agent_id }}" style="margin-left: 12px; padding: 8px 16px; background: #30363d; color: #c9d1d9; text-decoration: none; border-radius: 6px; display: inline-block;">
      Cancel
    </a>
  </div>
</form>

<h2 style="margin-top: 40px;">Versions</h2>
<p>
  <a href="/agents-ui/{{ agent_id }}/versions">View all versions →</a>
</p>
{% endblock %}
