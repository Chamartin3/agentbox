<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}agentbox{% endblock %}</title>
  <style>
    body { font-family: ui-monospace, Menlo, Consolas, monospace; margin: 0; background: #0d1117; color: #c9d1d9; }
    header { padding: 12px 20px; background: #161b22; border-bottom: 1px solid #30363d; }
    header a { color: #58a6ff; text-decoration: none; margin-right: 16px; }
    main { padding: 20px; max-width: 1200px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #30363d; font-size: 13px; }
    th { color: #8b949e; font-weight: 500; }
    tr:hover td { background: #161b22; }
    .pill { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .pill.ok { background: #1f6f3a; color: #fff; }
    .pill.error { background: #8b1a1a; color: #fff; }
    .pill.running { background: #1f6feb; color: #fff; }
    pre { background: #161b22; padding: 12px; border-radius: 6px; overflow-x: auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    h1, h2 { font-weight: 500; }
    a { color: #58a6ff; }
  </style>
</head>
<body>
  <header>
    <strong>agentbox</strong>
    <a href="/">runs</a>
    <a href="/agents-ui">agents</a>
    <a href="/health">health</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
